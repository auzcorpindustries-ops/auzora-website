# .github/workflows/auto-merge.yml — Auto-merge PRs to develop after CI passes
# Only applies to PRs targeting `develop` (NOT main — those need human approval).
name: Auto-Merge to Develop

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    name: Auto-Merge
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI checks and merge
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = pr.head.sha;

            console.log(`PR #${pr.number}: waiting for CI checks on ${sha}`);

            // auzora-website has no CI jobs — if there are no check runs,
            // just merge after a short delay (lets Last checks register).
            const maxWaitMs = 2 * 60 * 1000; // 2 min timeout
            const intervalMs = 15_000;
            const start = Date.now();

            while (Date.now() - start < maxWaitMs) {
              const { data: { check_runs } } = await github.rest.checks.listForRef({
                owner, repo, ref: sha, per_page: 100,
              });

              // Exclude our own "Auto-Merge" check run — otherwise we'd
              // wait for ourselves to finish, causing a circular timeout.
              const external = check_runs.filter(c => c.name !== 'Auto-Merge');

              // No CI configured on this repo — merge after a brief wait.
              if (external.length === 0) {
                console.log('No external CI checks found — waiting 15s for any to register...');
                await new Promise(r => setTimeout(r, 15_000));

                const { data: { check_runs: recheck } } = await github.rest.checks.listForRef({
                  owner, repo, ref: sha, per_page: 100,
                });
                const externalRecheck = recheck.filter(c => c.name !== 'Auto-Merge');

                if (externalRecheck.length === 0) {
                  console.log('Still no external CI checks — merging (no CI configured on this repo)');
                  await github.rest.pulls.merge({
                    owner, repo,
                    pull_number: pr.number,
                    merge_method: 'squash',
                  });
                  console.log(`PR #${pr.number}: merged!`);
                  return;
                }
              }

              // If we have external CI checks, wait for all to complete
              const allDone = external.every(c => c.status === 'completed');
              if (allDone) {
                console.log('All external CI checks completed:');
                external.forEach(c => console.log(`  ${c.name}: ${c.conclusion}`));

                // A check with conclusion 'neutral' (e.g. Netlify "Pages changed")
                // is not a failure — only block on 'failure' or 'cancelled'.
                const failed = external.filter(c =>
                  c.conclusion === 'failure' || c.conclusion === 'cancelled'
                );
                if (failed.length > 0) {
                  console.log('CI checks failed — skipping merge:');
                  failed.forEach(c => console.log(`  ${c.name}: ${c.conclusion}`));
                  return;
                }

                console.log('All CI checks passed (or neutral) — merging!');
                await github.rest.pulls.merge({
                  owner, repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                });
                console.log(`PR #${pr.number}: merged!`);
                return;
              }

              const pending = external.filter(c => c.status !== 'completed').map(c => c.name);
              console.log(`Waiting for: ${pending.join(', ')}...`);
              await new Promise(r => setTimeout(r, intervalMs));
            }

            console.log('Timed out waiting for CI checks (2 min) — skipping merge');
