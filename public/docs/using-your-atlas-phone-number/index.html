<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Sonello Docs — Using your Sonello phone number</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
/* Sonello — Frequency skin for the public/docs article mirrors.
   These pages also load the legacy /styles.css, so every rule here either
   matches that specificity and wins by source order, or outranks it. */
:root{
  --lowend:#0C1D1B; --under:#12332A; --carrier:#265B46; --pulse:#478C67;
  --tint:#7CBC8B; --ground:#E3EFE6; --paper:#FAFAF6;
  --card:#FFFFFF; --card2:#F3F7F3;
  --ink:#0C1D1B; --mu:#4A5E57; --sub:#5B6E67;
  --line:rgba(38,91,70,.12); --line2:rgba(38,91,70,.22);
  --onDark:#E3EFE6; --onDarkMu:#A9BDB2;
  --font-display:'Outfit',system-ui,sans-serif;
  --font-ui:'Hanken Grotesk',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --blue:#265B46; --text:#0C1D1B; --muted:#4A5E57; --border:rgba(38,91,70,.12);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-ui);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--carrier);outline-offset:2px;border-radius:6px;
}

/* ── nav ────────────────────────────────────────────────────────── */
#navbar{
  position:sticky;top:0;z-index:100;
  background:rgba(250,250,246,.92);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
#navbar .nav-inner{
  max-width:1200px;margin:0 auto;padding:0 40px;height:80px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
}
#navbar .nav-brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
#navbar .nav-logo{width:26px;height:29px;object-fit:contain;display:block;flex:none}
#navbar .nav-brand-text{
  font-family:var(--font-display);font-weight:300;font-size:23px;
  letter-spacing:.01em;line-height:1;
  color:var(--ink);-webkit-text-fill-color:currentColor;
  background:none;-webkit-background-clip:border-box;background-clip:border-box;
}
#navbar .nav-links{
  display:flex;align-items:center;gap:28px;margin:0;padding:0;list-style:none;
}
#navbar .nav-links a{
  font-size:14.5px;font-weight:500;color:var(--mu);text-decoration:none;
  padding:6px 0;transition:color .2s ease;
}
#navbar .nav-links a:hover{color:var(--ink)}
#navbar .nav-cta{
  display:inline-flex;align-items:center;justify-content:center;
  height:42px;padding:0 20px;border-radius:999px;
  background:var(--carrier);border:1px solid var(--carrier);
  color:#EAF3EC;font-size:14.5px;font-weight:600;text-decoration:none;
  transition:background .2s ease,border-color .2s ease;
}
#navbar .nav-cta:hover{background:#2E6B52;border-color:#2E6B52}
#navbar .nav-toggle{
  display:none;flex-direction:column;justify-content:center;gap:5px;
  width:42px;height:42px;padding:0 10px;
  background:transparent;border:1px solid var(--line2);border-radius:10px;
  cursor:pointer;
}
#navbar .nav-toggle span{display:block;height:2px;background:var(--ink);border-radius:2px}

/* ── article shell ──────────────────────────────────────────────── */
.docs-container{max-width:820px;margin:0 auto;padding:56px 24px 88px}
.docs-content,
#docs-page{
  background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:16px;
  padding:44px 48px;margin:0 auto;max-width:760px;
  box-shadow:0 1px 2px rgba(12,29,27,.04),0 14px 34px rgba(12,29,27,.06);
  font-size:16px;line-height:1.7;
}
#docs-page{max-width:760px;margin:56px auto;padding:44px 48px}

.docs-content h1,#docs-page h1{
  font-family:var(--font-display);font-size:clamp(28px,3.2vw,36px);
  font-weight:500;letter-spacing:-.02em;line-height:1.14;
  color:var(--ink);margin:0 0 20px;
}
.docs-content h2,#docs-page h2{
  font-family:var(--font-display);font-size:24px;font-weight:500;
  letter-spacing:-.015em;line-height:1.28;color:var(--ink);
  margin:34px 0 12px;padding-top:22px;border-top:1px solid var(--line);
  scroll-margin-top:92px;
}
.docs-content h3,#docs-page h3{
  font-family:var(--font-ui);font-size:17px;font-weight:700;
  color:var(--ink);margin:24px 0 9px;scroll-margin-top:92px;
}
.docs-content p,#docs-page p{
  font-size:16px;line-height:1.75;color:var(--mu);margin:0 0 14px;text-wrap:pretty;
}
.docs-content p:empty,#docs-page p:empty{display:none}
.docs-content strong,#docs-page strong{color:var(--ink);font-weight:700}
.docs-content em,#docs-page em{font-style:italic}
.docs-content ul,.docs-content ol,
#docs-page ul,#docs-page ol{
  margin:0 0 18px;padding-left:22px;display:flex;flex-direction:column;gap:8px;
}
.docs-content li,#docs-page li{
  font-size:16px;line-height:1.65;color:var(--mu);margin:0;text-wrap:pretty;
}
.docs-content a,#docs-page a{
  color:var(--carrier);text-decoration:underline;text-underline-offset:2px;
}
.docs-content a:hover,#docs-page a:hover{color:var(--under)}
.docs-content hr,#docs-page hr{border:none;border-top:1px solid var(--line);margin:32px 0}

.docs-content code,#docs-page code{
  background:var(--ground);color:var(--under);
  font-family:var(--font-mono);font-size:13.5px;
  padding:2px 6px;border-radius:5px;
}
.docs-content pre,#docs-page pre{
  background:var(--card2);color:var(--ink);
  border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;margin:0 0 18px;overflow:auto;
}
.docs-content pre code,#docs-page pre code{background:none;padding:0;color:inherit}

.docs-content table,#docs-page table{
  width:100%;margin:0 0 22px;border-collapse:separate;border-spacing:0;
  border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:15px;
}
.docs-content th,#docs-page th{
  background:var(--card2);text-align:left;
  font-family:var(--font-mono);font-size:10.5px;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;color:var(--mu);
  padding:12px 16px;border-bottom:1px solid var(--line);
}
.docs-content td,#docs-page td{
  padding:13px 16px;border-bottom:1px solid var(--line);
  vertical-align:top;color:var(--mu);font-size:14.5px;
}
.docs-content td:first-child,#docs-page td:first-child{color:var(--ink);font-weight:600}
.docs-content tr:last-child td,#docs-page tr:last-child td{border-bottom:0}

.docs-content blockquote,#docs-page blockquote{
  margin:0 0 18px;padding:14px 18px;
  border-left:3px solid var(--carrier);background:var(--card2);
  border-radius:0 12px 12px 0;color:var(--ink);font-size:15.5px;
}
.docs-content img,#docs-page img{
  max-width:100%;display:block;margin:14px 0 22px;
  border:1px solid var(--line);border-radius:12px;
}

/* ── footer ─────────────────────────────────────────────────────── */
#footer{
  background:var(--lowend);color:var(--onDark);
  border-top:1px solid rgba(227,239,230,.14);
  margin-top:0;
}
#footer .container{max-width:1200px;margin:0 auto;padding:0 40px}
#footer .footer-inner{
  display:flex;flex-direction:column;align-items:center;gap:16px;
  padding:48px 0 44px;text-align:center;
}
#footer .footer-brand{
  display:inline-flex;align-items:center;gap:10px;
  text-decoration:none;color:var(--onDark);
}
#footer .footer-logo{width:24px;height:27px;object-fit:contain;display:block}
#footer .footer-brand span{
  font-family:var(--font-display);font-weight:300;font-size:21px;letter-spacing:.01em;
}
#footer .footer-copy{margin:0;font-size:13px;color:var(--onDarkMu)}
#footer .footer-links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px}
#footer .footer-links a{
  font-size:13.5px;color:var(--onDarkMu);text-decoration:none;
  transition:color .2s ease;
}
#footer .footer-links a:hover{color:var(--onDark)}

/* ── responsive ─────────────────────────────────────────────────── */
@media (max-width:900px){
  #navbar .nav-inner{padding:0 24px;height:72px;flex-wrap:wrap}
  #navbar .nav-toggle{display:flex}
  #navbar .nav-links{
    display:none;order:4;width:100%;flex-direction:column;
    align-items:flex-start;gap:2px;padding:8px 0 14px;
  }
  #navbar .nav-links.open{display:flex}
  #navbar .nav-links a{font-size:15px;padding:10px 0}
  .docs-container{padding:36px 18px 64px}
  .docs-content,#docs-page{padding:30px 24px;border-radius:14px}
  #docs-page{margin:32px 16px}
}
@media (max-width:600px){
  #navbar .nav-inner{padding:0 18px}
  #navbar .nav-brand-text{font-size:21px}
  .docs-content,#docs-page{padding:24px 18px}
  .docs-content h1,#docs-page h1{font-size:26px}
  .docs-content h2,#docs-page h2{font-size:21px}
  #footer .container{padding:0 20px}
  #footer .footer-inner{padding:36px 0}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" />
</head>
<body>
  <nav id="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-brand">
        <img src="/assets/logo.png" alt="Sonello Logo" class="nav-logo" />
        <span class="nav-brand-text">Sonello</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="#services">How It Works</a></li>
        <li><a href="#pricing">Pricing</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <a href="#pricing" class="btn btn-primary nav-cta">Get Started</a>
    </div>
  </nav>

  <main class="docs-container">
    <div id="docs" class="docs-content">Loading...</div>
  </main>

  <footer id="footer">
    <div class="container">
      <div class="footer-inner">
        <a href="/" class="footer-brand">
          <img src="/assets/logo.png" alt="Sonello" class="footer-logo" />
          <span>Sonello</span>
        </a>
        <p class="footer-copy">© 2026 Sonello. All rights reserved.</p>
        <div class="footer-links">
          <a href="#services">How It Works</a>
          <a href="#about">About</a>
          <a href="/contact.html">Contact</a>
          <a href="/legal/terms.html">Terms</a>
          <a href="/legal/privacy.html">Privacy</a>
          <a href="/legal/ai-policy.html">AI Policy</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js"></script>
  <script>
    (function(){
      const slug = 'using-your-atlas-phone-number';
      const mdPath = '/docs-md/' + slug + '.md';
      const target = document.getElementById('docs');
      fetch(mdPath).then(r=>{ if(!r.ok) throw new Error('Failed to fetch: '+r.status); return r.text() }).then(md=>{
        const html = marked.parse(md);
        target.innerHTML = DOMPurify.sanitize(html);
      }).catch(err=>{ target.innerHTML = '<p style="color:tomato">Error loading doc: '+err.message+'</p>' });
    })();
  </script>
  <script src="/script.js"></script>
</body>
</html>
