<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="/logo.png" />
<title>Checkout — Auzora</title>
<!-- Legacy bookmark shim (ticket zeus_1788214888355_14fc36fe): the old
     /checkout.html?plan=… "Coming Soon" flow is retired. Pricing moved to
     index.html#pricing with per-plan tier lists. This page carries the
     ?plan= param into the new deep link and redirects immediately. -->
<noscript><meta http-equiv="refresh" content="0;url=/index.html#pricing"/></noscript>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #101826;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .redirect-box { text-align: center; padding: 48px 24px; max-width: 560px; }
  .spinner { width: 22px; height: 22px; border: 3px solid rgba(124,58,237,.2); border-top-color: #7C3AED; border-radius: 50%; animation: azspin 0.9s linear infinite; margin: 0 auto 18px; }
  @keyframes azspin { to { transform: rotate(360deg); } }
  .redirect-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #7C3AED; margin-bottom: 10px; }
  .redirect-title { font-size: 28px; font-weight: 800; line-height: 1.2; margin-bottom: 10px; }
  .redirect-sub { font-size: 15px; color: #5f687a; margin-bottom: 26px; }
  .redirect-btn { display: inline-block; padding: 14px 34px; border-radius: 99px; font-weight: 600; font-size: 16px; color: #fff; background: #7C3AED; box-shadow: 0 6px 20px rgba(124,58,237,.3); text-decoration: none; }
  .redirect-btn:hover { box-shadow: 0 10px 28px rgba(124,58,237,.45); }
</style>
</head>
<body>
  <div class="redirect-box">
    <div class="spinner" aria-hidden="true"></div>
    <div class="redirect-label">Pricing updated</div>
    <h1 class="redirect-title">Taking you to our new pricing</h1>
    <p class="redirect-sub">Our plans now include usage tiers. Pick the tier that fits your business — this page is no longer needed.</p>
    <a id="redirectLink" href="/index.html#pricing" class="redirect-btn">Go to pricing →</a>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var plan = (params.get('plan') || '').toLowerCase();
      var target = '/index.html#pricing';
      if (['starter', 'pro', 'premium'].indexOf(plan) !== -1) {
        target = '/index.html#pricing?plan=' + plan;
      }
      var link = document.getElementById('redirectLink');
      if (link) link.setAttribute('href', target);
      window.location.replace(target);
    })();
  </script>
</body>
</html>
