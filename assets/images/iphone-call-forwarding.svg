<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="100%" height="100%" fill="#f7f8fb" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial" fill="#0b1226">
    <text x="60" y="80" font-size="42" font-weight="700">iPhone — Call Forwarding</text>
    <rect x="60" y="120" width="1080" height="520" rx="14" fill="#ffffff" stroke="#e6e9ef" />
    <text x="100" y="190" font-size="26" fill="#111827">Settings › Phone › Call Forwarding</text>
    <g fill="#0b1226">
      <text x="100" y="260" font-size="20">Call Forwarding</text>
      <rect x="100" y="280" width="980" height="60" rx="8" fill="#f1f5f9" stroke="#e2e8f0" />
      <text x="120" y="320" font-size="18" fill="#111827">Forward to</text>
      <text x="320" y="322" font-size="18" fill="#0b1226">+1 312 555 0123</text>
      <circle cx="1060" cy="310" r="18" fill="#10b981" />
      <text x="1048" y="316" font-size="22" fill="#ffffff">✓</text>
    </g>
    <text x="100" y="380" font-size="16" fill="#6b7280">Note: iOS device-level forwarding is unconditional. For 'No Answer' use your carrier's conditional forwarding code or portal.</text>
    <text x="60" y="700" font-size="18" fill="#374151">Caption: iPhone: Call Forwarding (use carrier conditional forwarding for No Answer)</text>
  </g>
</svg>